version: "3.8"

services:
  # DNS Server (dnsmasq) for DNS redirection
  dnsmasq:
    build:
      context: .
      dockerfile: docker/dnsmasq/Dockerfile
    container_name: dnsmasq-proxy
    hostname: dnsmasq-proxy
    ports:
      - "5353:53/udp"  # Use port 5353 on host to avoid privilege issues
    networks:
      proxy_network:
        ipv4_address: 172.20.0.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "echo | nc -w 1 127.0.0.1 53 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Browser Automation with Playwright and Mitmproxy
  playwright:
    build:
      context: .
      dockerfile: docker/playwright/Dockerfile
    container_name: playwright-browser
    hostname: playwright-browser
    depends_on:
      dnsmasq:
        condition: service_healthy
    environment:
      - DNS_SERVER=172.20.0.2
      - PROXY_SERVER=http://localhost:8080
    ports:
      - "8080:8080"  # Mitmproxy web interface
      - "3000:3000"  # Optional: for debugging
    networks:
      proxy_network:
        ipv4_address: 172.20.0.3
    dns:
      - 172.20.0.2  # Use our dnsmasq server
      - 8.8.8.8     # Fallback to Google DNS
    volumes:
      - ./screenshots:/app/screenshots
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional: Standalone Mitmproxy for advanced traffic manipulation
  mitmproxy:
    image: python:3.10-slim
    container_name: mitmproxy-standalone
    hostname: mitmproxy-standalone
    command: sh -c "pip install mitmproxy && mitmproxy -s /app/mitmproxy_script.py --listen-port 8080 --web-iface 0.0.0.0"
    volumes:
      - ./docker/playwright/scripts/mitmproxy_script.py:/app/mitmproxy_script.py
    ports:
      - "8081:8080"  # Mitmproxy web interface
      - "8082:8081"  # Mitmproxy control port
    networks:
      proxy_network:
        ipv4_address: 172.20.0.4
    restart: unless-stopped

networks:
  proxy_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
