version: '3.8'

# Docker Compose per ProxyBox (Sviluppo Locale)
# Architettura: Chromium Standalone + CDP + Playwright + Mitmproxy
#
# Servizi:
#   - proxybox: Container principale con tutti i servizi
#
# Porte:
#   - 5000: Flask API (Control Plane)
#   - 8080: Mitmproxy (Traffic Interception)
#   - 9222: Chromium CDP (Browser Control)
#
# Volumi:
#   - chromium_data: Dati persistenti del browser (cookies, storage, ecc.)

services:
  proxybox:
    build:
      context: .
      dockerfile: Dockerfile.render
    container_name: proxybox
    restart: unless-stopped
    ports:
      - "5000:5000"   # Flask API
      - "8080:8080"   # Mitmproxy
      - "9222:9222"   # Chromium CDP (solo per sviluppo locale)
    environment:
      - FLASK_PORT=5000
      - MITMPROXY_PORT=8080
      - CDP_PORT=9222
      - PROXY_SERVER=http://127.0.0.1:8080
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    volumes:
      - chromium_data:/data/chromium
    networks:
      - proxybox_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Volumi persistenti
volumes:
  chromium_data:
    driver: local

# Rete dedicata
networks:
  proxybox_network:
    driver: bridge
