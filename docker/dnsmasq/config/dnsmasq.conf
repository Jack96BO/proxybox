# dnsmasq configuration for ProxyBox
# Dynamic DNS redirection - custom routes can be added via API

# Listen on all interfaces
listen-address=0.0.0.0

# Don't use /etc/resolv.conf
no-resolv

# Enable DNS caching
cache-size=1000

# Log queries
log-queries
log-facility=-

# Don't read /etc/hosts
no-hosts

# Include custom DNS configuration from external file
conf-dir=/etc/dnsmasq.d

# Upstream DNS servers (Google DNS as fallback)
server=8.8.8.8
server=8.8.4.4
