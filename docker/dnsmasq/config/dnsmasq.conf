# dnsmasq configuration for DNS redirection
# Redirect ilmiosito.com to 10.58.54.2
address=/ilmiosito.com/10.58.54.2

# Listen on all interfaces
listen-address=0.0.0.0

# Don't use /etc/resolv.conf
no-resolv

# Enable DNS caching
cache-size=1000

# Log queries
log-queries
log-facility=-

# Don't read /etc/hosts
no-hosts

# Enable DNSSEC
# dnssec

# Upstream DNS servers (Google DNS as fallback)
server=8.8.8.8
server=8.8.4.4
